{% load static %}<!DOCTYPE html><html lang="zh-CN"><head>
{% include 'netbox_oa/inc/notifications.html' %}
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>维护服务工单手写签名</title>
<script src="{% static 'netbox_oa/maintenance-theme.js' %}"></script>
<link rel="stylesheet" href="{% static 'netbox-external.css' %}">
<link rel="stylesheet" href="{% static 'netbox.css' %}">
<link rel="stylesheet" href="{% static 'netbox_oa/maintenance-signature.css' %}?v=20261018-1">
</head><body><main>
{% if error %}<header class="signature-header"><h1>手写签名</h1></header><p role="alert" data-oa-notice="danger">{{ error }}</p><p>请返回电脑端重新生成二维码。</p>
{% elif success %}<header class="signature-header"><h1>手写签名</h1></header><p data-oa-notice="success">签名已提交。请回到电脑端核对签名并确认审核。</p>
{% else %}
<form method="post" data-signature-canvas-form>
<header class="signature-header"><h1>手写签名</h1><p>{{ number }} · {{ node }}</p></header>
<input type="hidden" name="submission_token" value="{{ submission_token }}">
<div class="signature-canvas-area"><canvas width="1280" height="720" aria-label="手写签名区域">浏览器不支持手写签名，请更换浏览器。</canvas></div>
<input type="hidden" name="image_data"><div class="signature-actions"><p data-canvas-error role="alert"></p>
<label class="signature-save"><input type="checkbox" name="save_signature">保存签名以供下次使用</label>
<button class="btn btn-ghost-secondary" type="button" data-signature-clear>清空重写</button><button class="btn btn-primary" type="submit">提交签名</button>
</div></form>{% endif %}
</main><script src="{% static 'netbox_oa/maintenance-signature.js' %}?v=20261018-1" defer></script></body></html>

{% extends 'base/layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
  <div class="card"><div class="card-body">
    <h2>{{ title }}</h2>
    <form method="post">{% csrf_token %}{{ form.as_p }}
      <button class="btn btn-primary" type="submit">保存</button>
      <a class="btn btn-outline-secondary" href="{% url 'plugins:netbox_oa:maintenance_workbench' %}">返回工作台</a>
    </form>
  </div></div>
  {% if policies %}<div class="card mt-3"><div class="card-body"><h3>已有流程配置</h3>
    {% for policy in policies %}<p><a href="{{ policy.get_absolute_url }}">{{ policy.name }}</a></p>{% endfor %}
  </div></div>{% endif %}
</div></div>
{% endblock %}

<style>
  .oa-todo-widget { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 12px; text-align: center; }
  .oa-todo-widget a { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; }
  .oa-todo-widget-icon { font-size: 2.2rem; margin-bottom: 8px; color: #fd7e14; }
  .oa-todo-widget-count { font-size: 2rem; font-weight: 700; color: var(--bs-body-color); line-height: 1; margin-bottom: 4px; }
  .oa-todo-widget-label { font-size: .8rem; color: var(--bs-secondary-color); }
  .oa-todo-widget-tasks { display: flex; justify-content: center; gap: 24px; }
  .oa-todo-widget-stat { display: flex; flex-direction: column; align-items: center; }
  .oa-todo-widget-drafts { margin-top: 8px; font-size: .8rem; color: var(--bs-secondary-color); }
  .oa-todo-widget-drafts strong { color: var(--bs-body-color); }
  .oa-todo-widget.zero .oa-todo-widget-icon { color: #198754; }
  .oa-todo-widget.zero .oa-todo-widget-count { color: var(--bs-secondary-color); }
  .oa-todo-widget a:hover .oa-todo-widget-count,
  .oa-todo-widget a:focus-visible .oa-todo-widget-count { color: #0d6efd; }
  .oa-todo-widget a:hover .oa-todo-widget-icon { color: #0d6efd; transform: scale(1.1); transition: all .2s ease; }
</style>
<div class="oa-todo-widget{% if not has_pending %} zero{% endif %}">
  <a href="{{ todo_url }}" title="点击进入工单 V2 待办工单" aria-label="待办 {{ pending_count }}，可代办 {{ delegated_count }}，点击进入工单 V2">
    <span class="oa-todo-widget-icon"><i class="mdi {% if has_pending %}mdi-clipboard-alert-outline{% else %}mdi-clipboard-check-outline{% endif %}" aria-hidden="true"></i></span>
    <div class="oa-todo-widget-tasks">
      <span class="oa-todo-widget-stat">
        <span class="oa-todo-widget-count">{{ pending_count }}</span>
        <span class="oa-todo-widget-label" title="分配给你或你所在组的待审批、待处理工单">待办</span>
      </span>
      <span class="oa-todo-widget-stat">
        <span class="oa-todo-widget-count">{{ delegated_count }}</span>
        <span class="oa-todo-widget-label">可代办</span>
      </span>
    </div>
    {% if not has_pending %}<span class="oa-todo-widget-label">暂无待办工单</span>{% endif %}
  </a>
  <div class="oa-todo-widget-drafts">草稿 <strong>{{ draft_count }}</strong></div>
</div>
